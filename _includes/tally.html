{%- assign fid = include.form | strip -%}
{%- if fid != "" -%}
<iframe data-tally-src="https://tally.so/embed/{{ fid }}?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1{{ include.params }}" loading="lazy" width="100%" height="420" frameborder="0" marginheight="0" marginwidth="0" title="{{ include.title | escape }}"></iframe>
<p class="privacy">{{ t.privacy }}</p>
{%- elsif site.data.settings.show_placeholders -%}
<div class="edit"><div class="eyebrow">Form</div>{{ t.form_ph }}</div>
{%- endif -%}
