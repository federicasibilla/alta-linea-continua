---
layout: default
---
<div class="pagehead">
  <div class="eyebrow">Ema &amp; Federica</div>
  <h1>Control <em>room</em></h1>
</div>
<form class="lock-form" id="lockform" autocomplete="off">
  <label for="lockpw" class="eyebrow">Password</label>
  <div class="lock-row">
    <input id="lockpw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Open</button>
  </div>
  <label class="lock-remember"><input type="checkbox" id="lockremember"> Remember on this device</label>
  <p class="lock-msg" id="lockmsg" aria-live="polite"></p>
</form>
<div id="lockcontent" hidden></div>
<p class="lock-out" id="lockout" hidden><button type="button" class="btn" id="lockforget">Lock and forget on this device</button></p>
<script>
(function () {
  var B = {{ site.data.team_lock | jsonify }};
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  async function open(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(B.s), iterations: B.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(B.i) }, key, b64(B.c));
    return new TextDecoder().decode(out);
  }
  async function tryOpen(pw) {
    var cands = [pw, pw + "!", pw.replace(/!$/, "")];
    for (var i = 0; i < cands.length; i++) { try { return { html: await open(cands[i]), pw: cands[i] }; } catch (e) {} }
    return null;
  }
  var form = document.getElementById("lockform"), msg = document.getElementById("lockmsg"), box = document.getElementById("lockcontent"), out = document.getElementById("lockout");
  function show(html) { box.innerHTML = html; box.hidden = false; form.hidden = true; out.hidden = false; }
  var saved = null; try { saved = localStorage.getItem("alc-team"); } catch (e) {}
  if (saved) tryOpen(saved).then(function (r) { if (r) show(r.html); });
  form.addEventListener("submit", async function (e) {
    e.preventDefault(); msg.textContent = "Opening…";
    var r = await tryOpen(document.getElementById("lockpw").value);
    if (!r) { msg.textContent = "Wrong password. Check capital letters and try again."; return; }
    if (document.getElementById("lockremember").checked) { try { localStorage.setItem("alc-team", r.pw); } catch (e) {} }
    msg.textContent = ""; show(r.html);
  });
  document.getElementById("lockforget").addEventListener("click", function () { try { localStorage.removeItem("alc-team"); } catch (e) {} location.reload(); });
})();
</script>
