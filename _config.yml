title: Alta Linea Continua
description: One continuous line across the Ligurian, Maritime and Cottian Alps, from Pian delle Gorre to Pian del Re. Ema & Federica, summer 2026.
authors: Ema & Federica
url: "https://federicasibilla.github.io"
baseurl: "/alta-linea-continua"
lang: en

# Paste the code from Google Search Console here (only the content="..." part)
google_site_verification: ""

collections:
  stages:
    output: true
    permalink: /stages/:name/

defaults:
  - scope: { path: "", type: stages }
    values: { layout: stage }

markdown: kramdown
kramdown:
  input: GFM
exclude: [README.md, .pages.yml, Gemfile, Gemfile.lock, vendor, scripts]
