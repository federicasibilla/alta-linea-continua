name: Update route data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/summits.py"]
permissions:
  contents: write
jobs:
  summits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/summits.py
        continue-on-error: true
      - name: Commit result
        run: |
          git config user.name "route-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _data/summits_auto.json _data/summits_status.json 2>/dev/null || true; git add -A _data
          git diff --cached --quiet || git commit -m "Update summits found along the route"
          git pull --rebase origin main && git push
